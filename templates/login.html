<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sign in • TikTok Smart Cut</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/static/css/style.css" />
<style>
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: 100%;
    max-width: 360px;
  }
  .login-card h1 {
    font-size: 1.1rem;
    margin: 0 0 4px;
  }
  .login-card p {
    opacity: .65;
    margin: 0 0 20px;
    font-size: .9rem;
  }
  .login-card input[type="password"] {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #111112;
    color: #fff;
    margin-bottom: 14px;
  }
  .login-error {
    color: #ff6b6b;
    font-size: .85rem;
    margin: 0 0 14px;
  }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <div class="card-body">
      <h1>TikTok Smart Cut</h1>
      <p>Enter the password to continue.</p>

      {% if error %}
      <p class="login-error">{{ error }}</p>
      {% endif %}

      <form method="post" action="/login">
        <input type="password" name="password" placeholder="Password" autofocus required />
        <button type="submit" class="btn">Sign in</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
